<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IT Help Desk &amp; Ticketing System — ERD</title>
<style>
  body {
    margin: 0;
    padding: 32px 16px;
    background: #FFFFFF;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: #1A1A1A;
  }
  h1 {
    text-align: center;
    font-size: 22px;
    font-weight: 600;
    color: #1A1A1A;
    margin-bottom: 4px;
  }
  p.subtitle {
    text-align: center;
    font-size: 14px;
    color: #444444;
    margin-top: 0;
    margin-bottom: 28px;
  }
  #erd {
    max-width: 1200px;
    margin: 0 auto;
    overflow-x: auto;
  }
  /* Force readable colors on the mermaid ER diagram output */
  #erd svg text {
    fill: #1A1A1A !important;
  }
  #erd svg .er.entityBox {
    fill: #EAF2FB !important;
    stroke: #1D4E89 !important;
  }
  #erd svg .er.attributeBoxOdd {
    fill: #FFFFFF !important;
  }
  #erd svg .er.attributeBoxEven {
    fill: #F3F6FA !important;
  }
  #erd svg .er.relationshipLabelBox {
    fill: #FFFFFF !important;
  }
  #erd svg .er.relationshipLine {
    stroke: #555555 !important;
  }
  #erd svg .er.entityLabel {
    fill: #0B2E4F !important;
    font-weight: 600 !important;
  }
</style>
</head>
<body>
  <h1>IT Help Desk &amp; Ticketing Management System</h1>
  <p class="subtitle">Entity Relationship Diagram</p>
  <div id="erd"></div>

  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

    mermaid.initialize({
      startOnLoad: false,
      theme: 'base',
      themeVariables: {
        darkMode: false,
        fontFamily: '-apple-system, "Segoe UI", Roboto, Arial, sans-serif',
        fontSize: '14px',
        primaryColor: '#EAF2FB',
        primaryTextColor: '#1A1A1A',
        primaryBorderColor: '#1D4E89',
        lineColor: '#555555',
        textColor: '#1A1A1A'
      }
    });

    const definition = `erDiagram
  ROLES ||--o{ USERS : has
  USERS ||--o{ TICKETS : creates
  USERS ||--o{ TICKETS : "assigned to"
  CATEGORIES ||--o{ TICKETS : categorizes
  PRIORITIES ||--o{ TICKETS : sets
  STATUSES ||--o{ TICKETS : has
  TICKETS ||--o{ TICKET_COMMENTS : has
  USERS ||--o{ TICKET_COMMENTS : writes
  TICKETS ||--o{ TICKET_ATTACHMENTS : has
  USERS ||--o{ TICKET_ATTACHMENTS : uploads
  TICKETS ||--o{ ASSIGNMENT_HISTORY : has
  USERS ||--o{ ASSIGNMENT_HISTORY : "assigned by"
  USERS ||--o{ NOTIFICATIONS : receives
  TICKETS ||--o{ NOTIFICATIONS : triggers
  USERS ||--o{ ACTIVITY_LOGS : performs
  CATEGORIES ||--o{ KB_ARTICLES : classifies
  USERS ||--o{ KB_ARTICLES : authors
  USERS ||--o{ PASSWORD_RESETS : requests

  ROLES {
    int role_id PK
    string role_name
  }
  USERS {
    int user_id PK
    int role_id FK
    string full_name
    string email
    string password_hash
    boolean is_active
    datetime created_at
  }
  CATEGORIES {
    int category_id PK
    string name
  }
  PRIORITIES {
    int priority_id PK
    string name
    int level
  }
  STATUSES {
    int status_id PK
    string name
  }
  TICKETS {
    int ticket_id PK
    string ticket_ref_no
    int created_by FK
    int assigned_to FK
    int category_id FK
    int priority_id FK
    int status_id FK
    string subject
    text description
    datetime created_at
    datetime resolved_at
  }
  TICKET_COMMENTS {
    int comment_id PK
    int ticket_id FK
    int user_id FK
    text comment_text
    boolean is_internal
    datetime created_at
  }
  TICKET_ATTACHMENTS {
    int attachment_id PK
    int ticket_id FK
    int uploaded_by FK
    string file_name
    string file_path
    datetime uploaded_at
  }
  ASSIGNMENT_HISTORY {
    int history_id PK
    int ticket_id FK
    int assigned_by FK
    int assigned_to FK
    datetime assigned_at
  }
  NOTIFICATIONS {
    int notification_id PK
    int user_id FK
    int ticket_id FK
    string message
    boolean is_read
    datetime created_at
  }
  ACTIVITY_LOGS {
    int log_id PK
    int user_id FK
    string action
    string entity_type
    datetime created_at
  }
  KB_ARTICLES {
    int article_id PK
    int category_id FK
    int created_by FK
    string title
    text content
    string status
  }
  PASSWORD_RESETS {
    int reset_id PK
    int user_id FK
    string token_hash
    datetime expires_at
  }
`;

    const { svg } = await mermaid.render('erd-svg', definition);
    document.getElementById('erd').innerHTML = svg;
  </script>
</body>
</html>
